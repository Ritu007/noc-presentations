<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CHI Router Architecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: wide router diagram on the left, numbered reveal panel on the right; stacks on phones.
   Deliberately a single light look (requested), so no dark blocks. */
:root{
  --bg:#F2F6FB;
  --surface:#FFFFFF;
  --ink:#1B2A41;
  --muted:#5B6B82;
  --hair:#D3DDEA;
  --line:#8EA2BF;
  --router:#E6EEF8;
  --router-edge:#B3C6DE;
  --core:#F0F5FC;
  --core-edge:#A7BCD9;
  --req:#2F7BD0;
  --dat:#E08A1E;
  --rsp:#2E9E6B;
  --snp:#8A5CD3;
  --crd:#D6456B;
  --link:#6A83A6;
  --accent:#0E7C86;
  --accent-soft:#D9F1F2;
  --l0:#DEE4F9;
  --l0-edge:#8F9DDA;
  --l1:#D5F0ED;
  --l1-edge:#77C3BC;
  --f-display:'IBM Plex Sans Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.4vw,36px);line-height:1.08;margin:0;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);max-width:62ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.fig-col{min-width:0;display:flex;flex-direction:column;gap:10px}
.stage{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:12px;overflow-x:auto}
.stage.clickable{cursor:pointer}
svg#fig{display:block;width:100%;min-width:680px;height:auto}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15;margin:0}
ul.points{margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.45}
ul.points li{padding-left:4px}
ul.points li::marker{color:var(--ink)}
ul.points li.new{animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ---------- SVG ---------- */
svg text{font-family:var(--f-body)}
.router{fill:var(--router);stroke:var(--router-edge);stroke-width:1.2}
.core-box{fill:var(--core);stroke:var(--core-edge);stroke-width:1.4}
.l0{fill:var(--l0);stroke:var(--l0-edge);stroke-width:1.2}
.l1{fill:var(--l1);stroke:var(--l1-edge);stroke-width:1.2}
.t-big{font-family:var(--f-display);font-weight:700;fill:var(--ink)}
.core-title{font:700 78px var(--f-display);fill:var(--ink);text-anchor:middle;letter-spacing:2px}
.lab{font-size:30px;text-anchor:middle}
.lab-s{font-size:16px;text-anchor:middle}
.brace{fill:none;stroke:var(--line);stroke-width:1.2}
.oval{fill:none;stroke:var(--line);stroke-width:1}
.sig-name{font:500 9.6px var(--f-mono);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.bits{font:400 9.2px var(--f-mono);fill:var(--muted)}
.chname{font:700 11px var(--f-body);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.lk-title{font:600 10.5px var(--f-body);fill:var(--ink)}
.sig{transition:opacity .45s ease}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation:none!important}
}
</style>

<div class="wrap">
  <div class="grid">
    <section class="fig-col">
      <div class="stage clickable" id="stage">
        <svg id="fig" viewBox="0 0 1022 902" data-step="0" role="img" aria-label="CHI router in the centre with four neighbouring routers, links L0 and L1, and outbound and inbound REQ, DAT, RSP and SNP channels on the left">
          <!-- neighbour routers -->
          <rect class="router" x="341" y="2" width="465" height="68" rx="3"/>
          <text class="t-big" x="573.5" y="52" text-anchor="middle" font-size="40">ROUTER</text>
          <rect class="router" x="341" y="830" width="465" height="68" rx="3"/>
          <text class="t-big" x="573.5" y="880" text-anchor="middle" font-size="40">ROUTER</text>
          <rect class="router" x="2" y="190" width="70" height="500" rx="3"/>
          <text class="t-big" transform="translate(40 455) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="26" letter-spacing="3">ROUTER</text>
          <text class="t-big lab" x="32" y="346" font-size="24">TX</text>
          <text class="t-big lab" x="32" y="582" font-size="24">RX</text>
          <path class="brace" d="M60 228 h6 v210 h-6"/>
          <path class="brace" d="M60 466 h6 v210 h-6"/>
          <rect class="router" x="950" y="215" width="70" height="475" rx="3"/>
          <text class="t-big" transform="translate(985 452) rotate(90)" text-anchor="middle" dominant-baseline="central" font-size="26" letter-spacing="3">ROUTER</text>

          <!-- L0 and L1 -->
          <g transform="translate(916 107) rotate(45)"><rect class="l0" x="-78" y="-38" width="156" height="76" rx="3"/></g>
          <text class="t-big" x="916" y="120" text-anchor="middle" font-size="36">L0</text>
          <g transform="translate(218 795) rotate(45)"><rect class="l1" x="-78" y="-38" width="156" height="76" rx="3"/></g>
          <text class="t-big" x="218" y="808" text-anchor="middle" font-size="36">L1</text>

          <!-- central router -->
          <rect class="core-box" x="287" y="160" width="573" height="580" rx="3"/>
          <path class="brace" d="M322 228 h6 v210 h-6"/>
          <path class="brace" d="M322 466 h6 v210 h-6"/>
          <text class="t-big lab" x="362" y="345">RX</text>
          <text class="t-big lab" x="362" y="585">TX</text>
          <path class="brace" d="M372 163 v6 h121 v-6"/>
          <text class="t-big lab" x="432.5" y="198">TX</text>
          <path class="brace" d="M552 163 v6 h121 v-6"/>
          <text class="t-big lab" x="612.5" y="198">RX</text>
          <path class="brace" d="M376 737 v-6 h121 v6"/>
          <text class="t-big lab" x="436.5" y="716">RX</text>
          <path class="brace" d="M563 737 v-6 h121 v6"/>
          <text class="t-big lab" x="623.5" y="716">TX</text>
          <path class="brace" d="M852 334 h6 v120 h-6"/>
          <text class="t-big lab" x="822" y="398">TX</text>
          <path class="brace" d="M852 522 h6 v120 h-6"/>
          <text class="t-big lab" x="822" y="590">RX</text>
          <text class="t-big lab-s" x="819" y="184">RX</text>
          <text class="t-big lab-s" x="836" y="210">TX</text>
          <text class="t-big lab-s" x="305" y="702">RX</text>
          <text class="t-big lab-s" x="328" y="731">TX</text>

          <g id="links"></g>

          <g><text class="core-title" x="573.5" y="474">ROUTER</text></g>

        </svg>
      </div>
    </section>

    <aside class="panel" aria-live="polite">
      <h2>Updated CHI Router Architecture</h2>
      <ul class="points" id="points"></ul>
    </aside>
  </div>
</div>

<script>
(function(){
'use strict';
var NS='http://www.w3.org/2000/svg';
var cs=getComputedStyle(document.documentElement);
function tok(n){return cs.getPropertyValue(n).trim();}
var C={req:tok('--req'),dat:tok('--dat'),rsp:tok('--rsp'),snp:tok('--snp'),crd:tok('--crd'),link:tok('--link'),acc:tok('--accent'),line:tok('--line'),hair:tok('--hair')};
var CH=[['REQ',C.req,'162 bits'],['DAT',C.dat,'756 bits'],['RSP',C.rsp,'73 bits'],['SNP',C.snp,'126 bits']];
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function el(tag,attrs,parent){
  var n=document.createElementNS(NS,tag);
  for(var k in attrs){ if(attrs[k]!==undefined) n.setAttribute(k,attrs[k]); }
  if(parent) parent.appendChild(n);
  return n;
}
function txt(parent,x,y,s,cls,extra){
  var a={x:x,y:y,class:cls};
  if(extra){ for(var k in extra) a[k]=extra[k]; }
  var t=el('text',a,parent); t.textContent=s; return t;
}
function f(v){return v.toFixed(1);}

/* ---- flowing flit dots ---- */
var dots=[];
function addFlow(parent,d,color,n,speed,seed,r){
  var path=el('path',{d:d,fill:'none',stroke:'none'},parent);
  var len=path.getTotalLength();
  for(var i=0;i<n;i++){
    var c=el('circle',{r:r||2.2,fill:color},parent);
    dots.push({c:c,path:path,len:len,speed:speed,ph:((i/n)+(seed||0))%1});
  }
}
function place(t){
  for(var i=0;i<dots.length;i++){
    var d=dots[i];
    var s=(t*d.speed+d.ph*d.len)%d.len;
    var p=d.path.getPointAtLength(s);
    d.c.setAttribute('cx',f(p.x)); d.c.setAttribute('cy',f(p.y));
    d.c.style.opacity=Math.min(1,Math.min(s,d.len-s)/8);
  }
}

/* ---- shapes ---- */
function head(p,x,y,dir,color,s){
  var d=dir==='r'?-1:1;
  el('polygon',{points:x+','+y+' '+f(x+d*s*1.7)+','+f(y-s*0.7)+' '+f(x+d*s*1.7)+','+f(y+s*0.7),fill:color},p);
}
function vhead(p,x,y,dir,color,s){
  var d=dir==='d'?-1:1;
  el('polygon',{points:x+','+y+' '+f(x-s*0.7)+','+f(y+d*s*1.7)+' '+f(x+s*0.7)+','+f(y+d*s*1.7),fill:color},p);
}
function bigArrow(p,x1,y1,x2,y2,color){
  var dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux,bw=3.2,hw=9,hl=11;
  var bx=x2-ux*hl,by=y2-uy*hl;
  var pts=[[x1+px*bw,y1+py*bw],[bx+px*bw,by+py*bw],[bx+px*hw,by+py*hw],[x2,y2],[bx-px*hw,by-py*hw],[bx-px*bw,by-py*bw],[x1-px*bw,y1-py*bw]];
  el('polygon',{points:pts.map(function(q){return f(q[0])+','+f(q[1]);}).join(' '),fill:color,'fill-opacity':.14,stroke:color,'stroke-width':1.3,'stroke-linejoin':'round'},p);
}
function biArrow(p,x1,y1,x2,y2,color){
  var dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux,bw=2.6,hw=7,hl=9;
  function P(a,b){return f(x1+ux*a+px*b)+','+f(y1+uy*a+py*b);}
  var pts=[P(0,0),P(hl,hw),P(hl,bw),P(L-hl,bw),P(L-hl,hw),P(L,0),P(L-hl,-hw),P(L-hl,-bw),P(hl,-bw),P(hl,-hw)];
  el('polygon',{points:pts.join(' '),fill:color,'fill-opacity':.14,stroke:color,'stroke-width':1.3,'stroke-linejoin':'round'},p);
}

var links=document.getElementById('links');

/* ---- one signal row on the left link ---- */
function sigRow(o){
  var g=el('g',{class:'sig','data-k':o.k},links);
  var right=o.dir==='r';
  var xs=right?o.x1:o.x2, xe=right?o.x2:o.x1;
  var thick=o.k==='flit';
  var tipX=xe, lineEnd=right?xe-7:xe+7;
  el('line',{class:'ln',x1:right?o.x1:o.x2,y1:o.y,x2:lineEnd,y2:o.y,stroke:o.color,'stroke-width':thick?2.4:1.2},g);
  head(g,tipX,o.y,o.dir,o.color,thick?5.5:4);
  addFlow(g,'M'+xs+' '+o.y+' L'+xe+' '+o.y,o.color,thick?2:1,thick?58:o.k==='crd'?44:70,o.seed,thick?2.5:2);
  txt(g,(o.x1+o.x2)/2,o.y+3.4,o.name,'sig-name');
  txt(g,268,o.y+3.4,o.bits,'bits');
}
function header(h,name,color){
  var g=el('g',{class:'sig','data-k':'hdr'},links);
  el('line',{x1:72,y1:h,x2:181,y2:h,stroke:color,'stroke-width':1.2},g);
  el('line',{x1:181,y1:h,x2:181,y2:h+36,stroke:color,'stroke-width':1.2},g);
  txt(g,126,h+3.8,name,'chname');
}
function drawLink(out){
  var b=out?{rdy:234,h0:252,label:220,title:'Outbound link',cy:333}:{rdy:470,h0:488,label:456,title:'Inbound link',cy:571};
  var p=out?'TX':'RX';
  txt(links,84,b.label,b.title,'lk-title');
  el('ellipse',{class:'oval',cx:93,cy:b.cy,rx:13,ry:108},links);
  sigRow({y:b.rdy,x1:74,x2:262,dir:out?'r':'l',name:'rdyto_rcv_crds',bits:'1 bit',color:C.crd,k:'crd',seed:out?.1:.6});
  CH.forEach(function(c,i){
    var h=b.h0+i*49, name=c[0], col=c[1];
    header(h,name,col);
    var bitsW=c[2];
    sigRow({y:h+12,x1:181,x2:262,dir:out?'r':'l',name:((!out&&name==='SNP')?'TX':p)+name+'FLITV',bits:'1 bit',color:col,k:'valid',seed:i*.23});
    sigRow({y:h+24,x1:181,x2:262,dir:out?'r':'l',name:p+name+'FLIT',bits:bitsW,color:col,k:'flit',seed:i*.17+.3});
    sigRow({y:h+36,x1:181,x2:262,dir:out?'l':'r',name:p+name+'LCRDV',bits:'1 bit',color:C.crd,k:'crd',seed:i*.29+.5});
  });
}
drawLink(true);
drawLink(false);

/* ---- link bundles to the four neighbouring routers ---- */
var COL=[C.req,C.dat,C.rsp,C.snp];
function vBundle(xs,thinX,yTail,yTip,cy){
  var up=yTip<yTail;
  xs.forEach(function(x,i){
    var g=el('g',{class:'sig','data-k':'flit'},links);
    bigArrow(g,x,yTail,x,yTip,COL[i]);
    addFlow(g,'M'+x+' '+yTail+' L'+x+' '+yTip,COL[i],2,62,i*.21,2.5);
  });
  var g2=el('g',{class:'sig','data-k':'crd'},links);
  el('line',{class:'ln',x1:thinX,y1:yTail,x2:thinX,y2:yTip+(up?6:-6),stroke:C.crd,'stroke-width':1.2},g2);
  vhead(g2,thinX,yTip,up?'u':'d',C.crd,4);
  addFlow(g2,'M'+thinX+' '+yTail+' L'+thinX+' '+yTip,C.crd,1,48,.4,2);
  var cx=(xs[0]+thinX)/2;
  el('ellipse',{class:'oval',cx:cx,cy:cy,rx:(thinX-xs[0])/2+16,ry:12},links);
}
function hBundle(ys,thinY,xTail,xTip,cx){
  var rightward=xTip>xTail;
  ys.forEach(function(y,i){
    var g=el('g',{class:'sig','data-k':'flit'},links);
    bigArrow(g,xTail,y,xTip,y,COL[i]);
    addFlow(g,'M'+xTail+' '+y+' L'+xTip+' '+y,COL[i],2,62,i*.21,2.5);
  });
  var g2=el('g',{class:'sig','data-k':'crd'},links);
  el('line',{class:'ln',x1:xTail,y1:thinY,x2:xTip+(rightward?-6:6),y2:thinY,stroke:C.crd,'stroke-width':1.2},g2);
  head(g2,xTip,thinY,rightward?'r':'l',C.crd,4);
  addFlow(g2,'M'+xTail+' '+thinY+' L'+xTip+' '+thinY,C.crd,1,48,.4,2);
  var cy=(ys[0]+thinY)/2+ (ys[0]>thinY?(ys[ys.length-1]-thinY)/2-(ys[0]-thinY)/2:0);
  el('ellipse',{class:'oval',cx:cx,cy:(Math.min(thinY,ys[0])+Math.max(thinY,ys[ys.length-1]))/2,rx:12,ry:Math.abs(ys[ys.length-1]-thinY)/2+16},links);
}
vBundle([380,405,430,455],485,160,72,116);
vBundle([560,585,610,635],665,72,160,116);
vBundle([384,409,434,459],489,828,742,786);
vBundle([571,596,621,646],676,742,828,786);
hBundle([370,395,420,445],340,862,948,905);
hBundle([556,581,606,631],530,948,862,905);

/* ---- L0 and L1 links ---- */
function cornerFlow(g,x1,y1,x2,y2,seed){
  addFlow(g,'M'+x1+' '+y1+' L'+x2+' '+y2,C.link,1,34,seed,2.3);
}
(function(){
  var defs=[[880,125,845,160],[903,148,860,191],[240,763,287,716],[262,785,307,740]];
  defs.forEach(function(a,i){
    var g=el('g',{class:'sig','data-k':'link'},links);
    biArrow(g,a[0],a[1],a[2],a[3],C.link);
    var mx=(a[0]+a[2])/2,my=(a[1]+a[3])/2;
    el('ellipse',{class:'oval',cx:mx,cy:my,rx:15,ry:6,transform:'rotate(45 '+mx+' '+my+')'},g);
    cornerFlow(g,a[0],a[1],a[2],a[3],i*.25);
    cornerFlow(g,a[2],a[3],a[0],a[1],i*.25+.5);
  });
})();

/* ---- four points, revealed one by one on click ---- */
var POINTS=[
  'VA stage replaced by Resource Allocation (RA) stage, it checks the downstream credit availability.',
  'If credits are available, allocate resource to one of the available flit in buffers (FIFO) based on QoS and Age based.',
  'Integration of QoS, CHI Handshake and CHI-based Credit Mechanism.',
  'Proposed Age based priority algorithm to avoid flit starvation.'
];
var list=document.getElementById('points');
var stage=document.getElementById('stage');
var shown=0;
function reveal(){
  if(shown>=POINTS.length){ list.innerHTML=''; shown=0; stage.classList.add('clickable'); return; }
  var li=document.createElement('li');
  li.className='new';
  li.textContent=POINTS[shown];
  list.appendChild(li);
  shown++;
}
window.hwSlide={goto:function(){}};

/* ---- animation loop ---- */
if(reduce){ place(0); }
else{
  (function loop(ts){ place(ts/1000); requestAnimationFrame(loop); })(0);
}
})();
</script>

<script>
/* Hardware deck bridge: arrow keys / Space are forwarded to the deck, and the deck drives this slide's steps. */
(function(){
  function post(m){ try{ parent.postMessage(m,'*'); }catch(e){} }
  window.addEventListener('keydown',function(e){
    if(e.code==='ArrowRight'||e.code==='ArrowLeft'||e.code==='Space'){
      e.preventDefault(); e.stopImmediatePropagation(); post({hw:'key',code:e.code});
    }
  },true);
  window.hwReport=function(n){ post({hw:'step',step:n}); };
  window.hwPost=post;
  window.addEventListener('message',function(e){
    var m=e.data; if(!m||!m.hw||!window.hwSlide) return;
    if(m.hw==='goto') window.hwSlide.goto(m.step);
    else if(m.hw==='play'&&window.hwSlide.play) window.hwSlide.play();
    else if(m.hw==='pause'&&window.hwSlide.pause) window.hwSlide.pause();
  });
  window.addEventListener('load',function(){ setTimeout(function(){ post({hw:'ready'}); },0); });
})();
</script>
<style id="hw-fit">
/* fit inside the deck frame: a clicker cannot scroll */
html,body{height:100%;overflow:hidden}
body{padding-block:10px}
.stage{overflow:hidden}
svg#fig{min-width:0;width:100%;height:calc(100vh - 56px)}
aside.panel{display:none}
.grid{grid-template-columns:minmax(0,1fr)}
</style>
</body></html>
