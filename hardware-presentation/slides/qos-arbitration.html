<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>VC QoS Arbitration</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one schematic card on a white page. Six VC rows read left to right; a granted flit leaves along the dashed channel past the right edge. A segmented control picks the case. */
/* Single light look by choice: the page is white as requested. */
:root {
  --bg: #ffffff;
  --card: #ffffff;
  --slot: #ffffff;
  --ink: #18212b;
  --muted: #566271;
  --line: #2e3946;
  --soft: #d3d9e0;
  --faint: #aab4c0;
  --flit: #d5e8d4;
  --flit-edge: #7fae6a;
  --flit-ink: #18212b;
  --hot: #f8cecc;
  --hot-edge: #cf6a65;
  --hot-ink: #18212b;
  --hot-glow: 207, 106, 101;
  --accent: #1d5f8a;
  --font-sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --dur: 1100ms;
  color-scheme: light;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  padding-block: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 760px; margin: 0 auto; }
h1 {
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0 0 20px;
  text-wrap: balance;
}
.lede {
  margin: 0 0 20px;
  color: var(--muted);
  line-height: 1.5;
  max-width: 62ch;
}

.card {
  background: var(--card);
  border: 1px solid var(--soft);
  border-radius: 6px;
  padding: 16px;
  overflow: hidden;
}
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
  margin-bottom: 18px;
}

/* Case selector: segmented control */
.cases {
  display: flex;
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
}
.cases button {
  border: 0;
  border-radius: 0;
  background: var(--slot);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 7px 14px;
}
.cases button + button { border-left: 1px solid var(--line); }
.cases button:hover { background: #eef2f6; color: var(--ink); border-color: var(--line); }
.cases button[aria-pressed="true"] { background: var(--ink); color: #ffffff; }
.cases button:focus-visible { outline-offset: -3px; }

.ctrls { display: flex; gap: 8px; }
button {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--slot);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 14px;
  cursor: pointer;
}
.ctrls button:hover { border-color: var(--accent); color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"].all { background: var(--ink); color: #ffffff; }

.rows { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; height: 44px; }
.label {
  flex: 0 0 36px;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--muted);
}
.slot {
  flex: 0 0 min(300px, 52%);
  height: 44px;
  box-sizing: border-box;
  position: relative;
  border: 1.5px solid var(--line);
  border-radius: 2px;
  background: var(--slot);
}
.runway {
  flex: 1 1 0;
  min-width: 0;
  position: relative;
  margin-right: 2px;
  border-top: 1.5px dashed var(--faint);
}
.runway::after {
  content: "";
  position: absolute;
  right: -2px;
  top: -3.75px;
  border-left: 8px solid var(--faint);
  border-top: 4.5px solid transparent;
  border-bottom: 4.5px solid transparent;
}

.flit {
  position: absolute;
  inset: 0;
  z-index: 2;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid var(--flit-edge);
  border-radius: 2px;
  background: var(--flit);
  color: var(--flit-ink);
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 500;
  transition:
    transform var(--dur) cubic-bezier(0.45, 0.05, 0.3, 1),
    opacity 360ms ease-in calc(var(--dur) - 400ms),
    background-color 0.3s,
    border-color 0.3s;
}
.flit.appear { animation: appear 0.5s ease-out both; }
.flit.hot {
  background: var(--hot);
  border-color: var(--hot-edge);
  color: var(--hot-ink);
  animation: ping 1.3s ease-out infinite;
}
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }
@keyframes ping {
  0% { box-shadow: 0 0 0 0 rgba(var(--hot-glow), 0.55); }
  100% { box-shadow: 0 0 0 10px rgba(var(--hot-glow), 0); }
}

.caption {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-height: 3.1em;
  margin: 18px 0 0;
  line-height: 1.45;
}
.tag {
  flex: 0 0 auto;
  font-family: var(--font-mono);
  font-weight: 500;
  color: var(--accent);
}
.ctext.swap { animation: appear 0.4s ease-out both; }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 20px;
  margin: 12px 0 0;
  padding: 12px 0 0;
  border-top: 1px solid var(--soft);
  font-size: 13px;
  color: var(--muted);
  list-style: none;
}
.legend li { display: flex; align-items: center; gap: 8px; }
.sw {
  width: 22px;
  height: 14px;
  box-sizing: border-box;
  border: 1.5px solid;
  border-radius: 2px;
}
.sw.wait { background: var(--flit); border-color: var(--flit-edge); }
.sw.top { background: var(--hot); border-color: var(--hot-edge); }

@media (prefers-reduced-motion: reduce) {
  :root { --dur: 1ms; }
  .flit.hot, .flit.appear, .ctext.swap { animation: none; }
}
</style>

<main class="page">
  <h1>VC QoS Arbitration</h1>

  <section class="card" id="stage" aria-label="Virtual channel arbitration animation">
    <div class="bar">
      <div class="cases" role="group" aria-label="Case">
        <button type="button" data-k="a" aria-pressed="false">Case (a)</button>
        <button type="button" data-k="b" aria-pressed="false">Case (b)</button>
        <button type="button" data-k="c" aria-pressed="false">Case (c)</button>
      </div>
      <div class="ctrls">
        <button type="button" id="all" class="all" aria-pressed="true">Play all</button>
        <button type="button" id="toggle">Pause</button>
      </div>
    </div>

    <div class="rows" id="rows"></div>

    <p class="caption" aria-live="polite"><span class="tag" id="tag">(a)</span><span class="ctext" id="ctext"></span></p>

    <ul class="legend">
      <li><span class="sw wait"></span>Waiting flit</li>
      <li><span class="sw top"></span>Highest QoS, granted next</li>
    </ul>
  </section>
</main>

<script>
(() => {
  const NAMES = ['VC1', 'VC2', 'VC3', 'VC4', 'VC5', 'VCn'];
  const DUR = 1100;
  const CANCEL = Symbol('cancel');

  const rowsEl = document.getElementById('rows');
  const card = document.getElementById('stage');
  const tag = document.getElementById('tag');
  const ctext = document.getElementById('ctext');
  const caseBtns = Array.from(document.querySelectorAll('.cases button'));
  const allBtn = document.getElementById('all');
  const toggle = document.getElementById('toggle');

  const slots = NAMES.map((name) => {
    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = name;
    const slot = document.createElement('div');
    slot.className = 'slot';
    const runway = document.createElement('div');
    runway.className = 'runway';
    row.append(label, slot, runway);
    rowsEl.appendChild(row);
    return slot;
  });

  const CAPTIONS = {
    a0: ['(a)', 'Three flits are waiting, one per virtual channel.'],
    a1: ['(a)', 'VC3 flit will get the priority (high QoS value).'],
    b0: ['(b)', 'A new flit with QoS = 10 arrives at VC5.'],
    b1: ['(b)', 'VC5 flit will get the priority (high QoS value).'],
    c: ['(c)', 'VC4 and VC1 flits will starve for a long time.']
  };

  let token = 0;
  let paused = false;
  let mode = 'all'; // 'all' loops a, b, c; 'a' | 'b' | 'c' plays one case and holds

  function wait(ms, t) {
    return new Promise((resolve, reject) => {
      let left = ms;
      let last = performance.now();
      const tick = () => {
        if (t !== token) return reject(CANCEL);
        const now = performance.now();
        if (!paused) left -= now - last;
        last = now;
        if (left <= 0) return resolve();
        setTimeout(tick, 50);
      };
      tick();
    });
  }

  function addFlit(rowIdx, qos, appear) {
    const el = document.createElement('div');
    el.className = 'flit' + (appear ? ' appear' : '');
    el.textContent = 'QoS = ' + qos;
    slots[rowIdx].appendChild(el);
    return el;
  }

  function setStage(k) {
    caseBtns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === k)));
  }

  function say(key) {
    const c = CAPTIONS[key];
    tag.textContent = c[0];
    ctext.textContent = c[1];
    ctext.classList.remove('swap');
    void ctext.offsetWidth;
    ctext.classList.add('swap');
  }

  function setupCase(k) {
    slots.forEach((s) => { s.textContent = ''; });
    const f = { f8: addFlit(0, 8, true), f2: addFlit(3, 2, true) };
    if (k === 'a') f.f12 = addFlit(2, 12, true);
    setStage(k);
    say(k === 'a' ? 'a0' : k === 'b' ? 'b0' : 'c');
    return f;
  }

  async function slideOut(el, t) {
    const slotRect = el.parentElement.getBoundingClientRect();
    const sc = card.getBoundingClientRect().width / card.offsetWidth || 1;
    const dist = (card.getBoundingClientRect().right - slotRect.left) / sc + 6;
    el.style.transform = 'translateX(' + dist + 'px)';
    el.style.opacity = '0';
    await wait(DUR + 80, t);
    el.remove();
  }

  async function slideIn(el, t) {
    const slotRect = el.parentElement.getBoundingClientRect();
    const sc = card.getBoundingClientRect().width / card.offsetWidth || 1;
    const dx = (slotRect.right - card.getBoundingClientRect().left) / sc + 6;
    el.style.transition = 'none';
    el.style.transform = 'translateX(' + (-dx) + 'px)';
    void el.offsetWidth;
    el.style.transition = '';
    el.style.transform = 'translateX(0)';
    await wait(DUR + 80, t);
  }

  // Case (a): VC3 holds the highest value, 12. It is highlighted and leaves.
  async function caseA(f, t) {
    await wait(1400, t);
    f.f12.classList.add('hot');
    say('a1');
    await wait(1900, t);
    await slideOut(f.f12, t);
    await wait(500, t);
  }

  // Case (b): QoS 10 arrives at VC5, is highlighted and leaves.
  async function caseB(t) {
    setStage('b');
    say('b0');
    await wait(mode === 'all' ? 0 : 900, t);
    const f10 = addFlit(4, 10, false);
    await slideIn(f10, t);
    await wait(900, t);
    f10.classList.add('hot');
    say('b1');
    await wait(1900, t);
    await slideOut(f10, t);
    await wait(500, t);
  }

  // Case (c): only QoS 8 and 2 remain.
  async function caseC(t) {
    setStage('c');
    say('c');
    await wait(3600, t);
  }

  async function run(t) {
    try {
      if (mode === 'all') {
        while (true) {
          const f = setupCase('a');
          await caseA(f, t);
          await caseB(t);
          await caseC(t);
        }
      } else if (mode === 'a') {
        const f = setupCase('a');
        await caseA(f, t);
      } else if (mode === 'b') {
        setupCase('b');
        await caseB(t);
      } else {
        setupCase('c');
      }
    } catch (e) {
      if (e !== CANCEL) throw e;
    }
  }

  function start(newMode) {
    mode = newMode;
    paused = false;
    toggle.textContent = 'Pause';
    allBtn.setAttribute('aria-pressed', String(mode === 'all'));
    if (mode === 'all') setStage('a');
    token += 1;
    run(token);
  }

  caseBtns.forEach((b) => b.addEventListener('click', () => start(b.dataset.k)));
  allBtn.addEventListener('click', () => start('all'));
  toggle.addEventListener('click', () => {
    paused = !paused;
    toggle.textContent = paused ? 'Play' : 'Pause';
  });

  /* deck-driven: step n is a fixed state; stepping forward by one animates the change, anything else jumps */
  const KEYS = ['a0', 'a1', 'b0', 'b1', 'c'];
  const els = {};
  let cur = -1, settled = false;
  function build(n) {
    slots.forEach((s) => { s.textContent = ''; });
    els.v1 = addFlit(0, 8, false);
    els.v4 = addFlit(3, 2, false);
    els.v3 = els.v5 = null;
    if (n <= 1) { els.v3 = addFlit(2, 12, false); if (n === 1) els.v3.classList.add('hot'); }
    if (n === 2 || n === 3) { els.v5 = addFlit(4, 10, false); if (n === 3) els.v5.classList.add('hot'); }
  }
  async function go(n) {
    token += 1; const t = token; paused = false;
    const animate = settled && cur === n - 1;
    cur = n; settled = false;
    say(KEYS[n]);
    try {
      if (!animate) build(n);
      else if (n === 1) els.v3.classList.add('hot');
      else if (n === 2) { await slideOut(els.v3, t); els.v3 = null; els.v5 = addFlit(4, 10, false); await slideIn(els.v5, t); }
      else if (n === 3) els.v5.classList.add('hot');
      else if (n === 4) { await slideOut(els.v5, t); els.v5 = null; }
      if (t === token) settled = true;
    } catch (e) { if (e !== CANCEL) throw e; }
  }
  window.hwSlide = { goto: go };
})();
</script>

<style id="hw-fit">
/* fit inside the deck frame: the deck drives the steps, so the slide's own controls and captions are hidden */
html,body{height:100%;overflow:hidden}
body{padding:8px 0}
h1,.bar,.caption{display:none}
.page{width:760px;max-width:none;transform-origin:top center}
</style>
<script>
(function(){
  function fit(){
    var p=document.querySelector('.page'); p.style.transform=''; p.style.marginTop='0';
    var h=p.offsetHeight, k=Math.min((innerWidth-24)/760,(innerHeight-16)/h,2);
    p.style.transform='scale('+k+')';
    p.style.marginTop=Math.max(0,(innerHeight-h*k)/2-8)+'px';
  }
  addEventListener('load',fit); addEventListener('resize',fit); fit();
})();
</script>
<script>
/* Hardware deck bridge: arrow keys / Space are forwarded to the deck, and the deck drives this slide's steps. */
(function(){
  function post(m){ try{ parent.postMessage(m,'*'); }catch(e){} }
  window.addEventListener('keydown',function(e){
    if(e.code==='ArrowRight'||e.code==='ArrowLeft'||e.code==='Space'){
      e.preventDefault(); e.stopImmediatePropagation(); post({hw:'key',code:e.code});
    }
  },true);
  window.hwReport=function(n){ post({hw:'step',step:n}); };
  window.hwPost=post;
  window.addEventListener('message',function(e){
    var m=e.data; if(!m||!m.hw||!window.hwSlide) return;
    if(m.hw==='goto') window.hwSlide.goto(m.step);
    else if(m.hw==='play'&&window.hwSlide.play) window.hwSlide.play();
    else if(m.hw==='pause'&&window.hwSlide.pause) window.hwSlide.pause();
  });
  window.addEventListener('load',function(){ setTimeout(function(){ post({hw:'ready'}); },0); });
})();
</script>
</body></html>
