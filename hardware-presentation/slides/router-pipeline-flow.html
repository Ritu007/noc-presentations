<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHI Router – Pipeline Flow</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#f8fafc; --ink:#0f172a; --mut:#64748b; --line:#cbd5e1;
    --acc:#2563eb; --accg:rgba(37,99,235,.6);
    --ra:#ea580c; --rag:rgba(234,88,12,.7);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 18px 6px}
  h1{margin:0;font-size:19px;letter-spacing:.6px;font-weight:700}
  h1 span{color:var(--mut);font-weight:500;font-size:13px;margin-left:8px;letter-spacing:.3px}
  .ctrl{display:flex;gap:6px;margin-left:auto}
  button{font-weight:600;font-size:12.5px;font-family:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 13px;cursor:pointer;transition:background .15s,border-color .15s}
  button:hover{background:#eff6ff;border-color:#93c5fd}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  button.primary:hover{background:#1d4ed8}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 6px}
  .chip{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;color:#475569;cursor:pointer;user-select:none;transition:all .2s}
  .chip i{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#e2e8f0;color:#334155;font-size:11px}
  .chip:hover{border-color:#93c5fd}
  .chip.active{background:var(--acc);border-color:var(--acc);color:#fff}
  .chip.active i{background:#fff;color:var(--acc)}
  .chip.ra{border-color:#fdba74;background:#fff7ed;color:#9a3412}
  .chip.ra i{background:var(--ra);color:#fff}
  .chip.ra.active{background:var(--ra);border-color:var(--ra);color:#fff}
  .chip.ra.active i{background:#fff;color:var(--ra)}
  .chip .tag{font-size:9px;letter-spacing:.6px;background:var(--ra);color:#fff;border-radius:4px;padding:1px 4px}
  .chip.ra.active .tag{background:#fff;color:var(--ra)}
  .info{margin:0 18px 6px;padding:8px 14px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:8px;min-height:50px;transition:border-color .25s}
  .info.ra{border-left-color:var(--ra);background:#fff7ed}
  .info b{font-size:14px}
  .info p{margin:3px 0 0;font-size:12.5px;line-height:1.45;color:#334155}
  main{flex:1;min-height:0;padding:0 10px 8px}
  svg{display:block;width:100%;height:calc(100vh - 205px);min-height:520px}

  /* ---------- SVG styling ---------- */
  text{font-family:Arial,Helvetica,sans-serif;pointer-events:none}
  .blk{transition:opacity .35s}
  svg.staged .blk{opacity:.22}
  svg.staged .blk.on{opacity:1}
  svg.staged .blk.on .shape{stroke:var(--acc);stroke-width:1.9;filter:drop-shadow(0 0 3px var(--accg))}
  svg.staged .blk.on.ra .shape{stroke:var(--ra);filter:drop-shadow(0 0 4px var(--rag))}

  svg.staged .blk.ra:not(.on) .shape{stroke:#be185d;stroke-width:.9}
  svg.staged .blk.ra:not(.on) .rapulse{display:none}
  .arr{fill:none;stroke:#475569;stroke-width:1;marker-end:url(#ah)}
  .arr.dbl{marker-start:url(#ah)}
  .arr.dash{stroke-dasharray:3 2}
  .xline{fill:none;stroke:#475569;stroke-width:1}
  svg.staged .on .xline{stroke:var(--acc)}
  .wa{fill:#fff;stroke:#64748b;stroke-width:.9}
  svg.staged .on .arr{stroke:var(--acc);marker-end:url(#ahb)}
  svg.staged .on .arr.dbl{marker-start:url(#ahb)}
  svg.staged .on .wa{stroke:var(--acc);fill:#dbeafe}
  svg.staged .on .arr.ora{stroke:var(--ra);marker-end:url(#aho)}

  .rapulse{fill:none;stroke:var(--ra);stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:pulse 1.7s ease-out infinite}
  @keyframes pulse{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.16)}}
  .flash{animation:flash .9s ease-out}
  @keyframes flash{0%{fill:#f59e0b}100%{fill:#1e1b4b}}
  @media (prefers-reduced-motion:reduce){.rapulse{animation:none}}
</style>
</head>
<body>
<header>
  <h1>UPDATED CHI ROUTER ARCHITECTURE<span>pipeline stage by stage</span></h1>
  <div class="ctrl">
    <button id="bReset">⏮ Reset</button>
    <button id="bPrev">◀ Prev</button>
    <button id="bPlay" class="primary">⏸ Pause</button>
    <button id="bNext">Next ▶</button>
  </div>
</header>
<div class="chips" id="chips"></div>
<div class="info" id="info"></div>
<main>
  <svg id="d" viewBox="14 62 884 440" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
</main>

<script>
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs){ if(attrs[k]!==null && attrs[k]!==undefined) e.setAttribute(k,attrs[k]); }
  if(parent) parent.appendChild(e);
  return e;
}
const svg=document.getElementById('d');

/* ---------- markers ---------- */
const defs=el('defs',{},svg);
function marker(id,color){
  const m=el('marker',{id,markerUnits:'userSpaceOnUse',markerWidth:6,markerHeight:6,refX:5.5,refY:3,orient:'auto-start-reverse'},defs);
  el('path',{d:'M0,0 L6,3 L0,6 z',fill:color},m);
}
marker('ah','#475569'); marker('ahb','#2563eb'); marker('aho','#ea580c');

/* ---------- helpers ---------- */
function T(p,x,y,s,o={}){
  const t=el('text',{x,y,'text-anchor':o.a||'middle','font-size':o.s||6,'font-weight':o.w||400,fill:o.c||'#0f172a',
    transform:o.r?`rotate(${o.r} ${x} ${y})`:null},p);
  t.textContent=s; return t;
}
function TL(p,x,y,arr,o={}){ arr.forEach((s,i)=>T(p,x,y+i*(o.lh||7),s,o)); }
function R(p,x,y,w,h,fill,stroke,o={}){
  return el('rect',{x,y,width:w,height:h,rx:o.rx??2,fill,stroke,'stroke-width':o.sw||.9,'stroke-dasharray':o.dash||null,class:o.plain?null:'shape'},p);
}
function A(p,d,cls=''){ return el('path',{d,class:'arr '+cls},p); }
function WA(p,x1,x2,y){   // hollow wide arrow (flit data)
  el('polygon',{points:`${x1},${y-3.5} ${x2-8},${y-3.5} ${x2-8},${y-7} ${x2},${y} ${x2-8},${y+7} ${x2-8},${y+3.5} ${x1},${y+3.5}`,class:'wa'},p);
}
function G(stages,cls=''){ return el('g',{class:'blk '+cls,'data-s':stages.join(',')},svg); }
function badge(p,x,y,n,color='#1e293b'){
  el('circle',{cx:x,cy:y,r:6,fill:color,stroke:'#fff','stroke-width':1},p);
  T(p,x,y+2.4,String(n),{s:7,w:700,c:'#fff'});
}

/* frame */
el('rect',{x:22,y:70,width:868,height:422,rx:6,fill:'#fff',stroke:'#94a3b8','stroke-width':.8},svg);

const PORTS=['E','W','N','S','L0','L1'];
const CH=['REQ','DAT','SNP','RSP'];

/* ================= STAGE 1 : input ports + decoder ================= */
(function(){
  const g=G([1]);
  T(g,72,80,'INPUT PORTS',{s:6.5,w:700});
  PORTS.forEach((nm,i)=>{
    const y0=90+i*67;
    R(g,55,y0,53,56,nm==='N'?'#bbf7d0':'#dbeafe',nm==='N'?'#16a34a':'#60a5fa');
    CH.forEach((c,k)=>{
      const ry=y0+4+k*13;
      el('rect',{x:57,y:ry,width:26,height:11,fill:'#fff',stroke:'#334155','stroke-width':.6},g);
      T(g,70,ry+8,c,{s:6.2});
      A(g,`M22,${ry+5.5} H57`);
    });
    T(g,96,y0+31,nm,{s:8,w:700});
  });
  // dotted fan to decoder
  el('path',{d:'M108,224 L203,92 M108,280 L203,372',fill:'none',stroke:'#334155','stroke-width':.8,'stroke-dasharray':'2 2'},g);
  // signals into decoder
  T(g,126,139,'rdyto_rcv_crds',{s:5.5,a:'start'}); A(g,'M176,137 H203');
  T(g,150,177,'REQ',{s:7,w:700,a:'start'}); A(g,'M169,175 H203');
  T(g,134,211,'DAT',{s:7,w:700,a:'start'}); A(g,'M154,209 H203');
  T(g,128,271,'SNP',{s:7,w:700,a:'end'});
  el('path',{d:'M141,238 Q135,238 135,244 V260 Q135,267 130,267 Q135,267 135,274 V290 Q135,296 141,296',fill:'none',stroke:'#334155','stroke-width':.8},g);
  T(g,146,254,'SNPFLITV',{s:5.3,a:'start'}); A(g,'M178,252 H203');
  T(g,146,269,'SNPFLIT',{s:5.3,a:'start'}); A(g,'M172,267 H203');
  T(g,188,263,'126 bits',{s:5.3});
  T(g,146,285,'LCRDV',{s:5.3,a:'start'}); A(g,'M203,283 H172');
  T(g,160,321,'RSP',{s:7,w:700,a:'start'}); A(g,'M179,319 H203');
  // decoder
  R(g,203,92,97,280,'#a5f3fc','#0891b2');
  TL(g,251,207,['Decoder Logic','FSMs'],{s:7,w:700,lh:9});
  TL(g,251,229,['(Activation of links and','other modules, select','empty VCs to write','Flit)'],{s:5.4,lh:7.2});
  badge(g,203,92,1);
})();

/* ================= STAGE 2 : pipeline demuxes -> BW, VSM ================= */
(function(){
  const dm=[[92,148],[160,224],[237,292],[305,358]];            // REQ, DAT, SNP, RSP demux extents
  const cellY=(base,j)=>base+11*j+4.75;                         // BW VC cell centres
  const target={0:352, 1:352, 2:241, 3:290};                    // REQ,DAT -> L1 VCs, SNP -> N VCs, RSP -> W VCs
  const elbow={0:j=>358-4*j, 1:j=>344-3*j, 2:null, 3:j=>338+5*j};
  // select lines: decoder -> each demux individually (shown with the decoder in stage 1)
  const sel=(g,y1)=>{ A(g,`M300,${y1+6} H317 V${y1-4}`); T(g,309,y1+3.5,'sel',{s:4.2,c:'#475569'}); };
  const gs=G([1]), gd=G([]);                      // only the SNP select line is lit in the Decode stage
  dm.forEach(([y0,y1],k)=>sel(k===2?gs:gd,y1));
  dm.forEach(([y0,y1],k)=>{
    // only the SNP demux belongs to the Buffer Write stage highlight
    const g=G(k===2?[2]:[]);
    el('polygon',{points:`305,${y0+10} 330,${y0} 330,${y1} 305,${y1-10}`,fill:'#f1f5f9',stroke:'#334155','stroke-width':.9,class:'shape'},g);
    T(g,318,(y0+y1)/2,`Pipeline${k+1} ${CH[k]}`,{s:5.6,w:700,r:-90});
    A(g,`M300,${(y0+y1)/2} H305`);
    if(k===2) sel(g,y1);
    for(let j=0;j<4;j++){
      const ys=y0+(j+.5)*(y1-y0)/4, yt=cellY(target[k],j);
      if(k===2) A(g,`M330,${yt} H385`);   // straight into the N port VC cells
      else A(g,`M330,${ys.toFixed(1)} H346`);   // other demuxes: plain outward arrows
    }
  });
  const v=G([2]);
  R(v,363,92,98,56,'#d8b4fe','#9333ea');
  TL(v,412,107,['VC STATE MACHINE','and','CONTROL UNIT'],{s:6.3,w:700,lh:8});
  T(v,412,141,'(QoS/Age per channel etc.)',{s:5.2});
  A(v,'M398,148 V217','dbl'); A(v,'M424,148 V217','dbl');
})();

/* ================= BW (stages 2,3,6) ================= */
(function(){
  const g=G([2,3,6]);
  R(g,385,217,92,183,'#f8fafc','#334155');
  TL(g,431,226,['BUFFER WRITE','(BW)'],{s:6,w:700,lh:7});
  const groups=[['N',241],['W',290],['L1',352]];
  groups.forEach(([nm,y0])=>{
    for(let k=0;k<4;k++){
      el('rect',{x:407,y:y0+k*11,width:36,height:9.5,fill:'#fff',stroke:'#334155','stroke-width':.6},g);
      T(g,425,y0+k*11+7,'VC'+k,{s:5.3});
    }
    T(g,461,y0+26,nm,{s:8,w:700});
  });
  T(g,425,343,'⋮',{s:11,w:700});
  badge(g,385,217,2);
})();

/* ================= STAGE 3 : RC ================= */
(function(){
  const g=G([3]);
  A(g,'M452,217 V200 H505 V193');
  for(let k=5;k>=1;k--) R(g,480+2*k,140-5*k,66,52,k%2?'#fbcfe8':'#f9a8d4','#be185d',{sw:.6});
  R(g,480,140,66,52,'#fce7f3','#be185d');
  T(g,513,148,'XY ROUTING',{s:5.8,w:700});
  el('line',{x1:507,x2:519,y1:160,y2:160,stroke:'#334155','stroke-width':.8},g);
  el('line',{x1:513,x2:513,y1:154,y2:166,stroke:'#334155','stroke-width':.8},g);
  T(g,513,153,'N',{s:4.5,w:700}); T(g,513,170,'S',{s:4.5,w:700});
  T(g,504,162,'W',{s:4.5,w:700}); T(g,522,162,'E',{s:4.5,w:700});
  el('circle',{cx:491,cy:158,r:2.6,fill:'#111827'},g); el('circle',{cx:535,cy:158,r:2.6,fill:'#111827'},g);
  T(g,484,172,'CURR',{s:4.8,a:'start'}); T(g,543,172,'DEST',{s:4.8,a:'end'});
  T(g,513,181,'X COMPARE',{s:5.4,w:700}); T(g,513,189,'Y COMPARE',{s:5.4,w:700});
  badge(g,480,140,3);
})();

/* ================= STAGE 4 : RA (the updated block) ================= */
(function(){
  const g=G([4],'ra');
  R(g,556,116,84,72,'#fbcfe8','#ea580c',{sw:1.6});
  el('rect',{x:556,y:116,width:84,height:72,rx:2,class:'rapulse'},g);
  el('rect',{x:557,y:117,width:82,height:11,fill:'#fff'},g);
  T(g,598,125,'RESOURCE ALLOCATION (RA)',{s:5,w:700});
  TL(g,598,138,['Check Downstream Credit','Availability','If available, allocate','resource to one of the','available flit based on','QoS/Age value'],{s:5.3,lh:7.6});
  el('rect',{x:598,y:106,width:42,height:10,rx:2.5,fill:'#ea580c'},g);
  T(g,619,113.5,'UPDATED',{s:6,w:800,c:'#fff'});
  badge(g,556,116,4,'#ea580c');
  const c=G([4],'ra');
  A(c,'M500,410 V208 H598 V189','ora');
  T(c,508,343,'DOWNSTREAM CREDIT',{s:5.3,w:700,c:'#c2410c',r:-90});
})();

/* ================= STAGE 5 : SA ================= */
(function(){
  const g=G([5]);
  R(g,640,116,84,72,'#ede9fe','#7c3aed');
  el('rect',{x:641,y:117,width:82,height:11,fill:'#fff'},g);
  T(g,682,125,'SWITCH ALLOCATION (SA)',{s:5,w:700});
  el('rect',{x:646,y:134,width:24,height:18,fill:'#fff',stroke:'#334155','stroke-width':.6},g);
  TL(g,658,141,['PORTS','REQ'],{s:4.8,lh:6});
  A(g,'M658,152 V162');
  el('rect',{x:644,y:162,width:36,height:20,fill:'#fff',stroke:'#334155','stroke-width':.6},g);
  TL(g,662,170,['SEPARABLE','ALLOCATOR'],{s:4.4,lh:6});
  A(g,'M680,172 H686');
  el('rect',{x:686,y:164,width:34,height:20,fill:'#fff',stroke:'#334155','stroke-width':.6},g);
  TL(g,703,172,['GRANT','SIGNALS'],{s:4.6,lh:6});
  badge(g,640,116,5);
  const gg=G([5,6]);
  A(gg,'M703,188 V225');
})();

/* ================= STAGE 6 : ST ================= */
(function(){
  const g=G([6]);
  [262,311,373].forEach(y=>WA(g,477,610,y));
  TL(g,508,232,['FLIT DATA (126 bits)','AFTER ST READ'],{s:5.4,a:'start',lh:8});
  R(g,610,225,112,162,'#fbcfe8','#be185d');
  el('rect',{x:611,y:226,width:110,height:11,fill:'#fff'},g);
  T(g,666,234,'SWITCH TRAVERSAL (ST)',{s:5.2,w:700});
  // crossbar switch symbol: two inputs cross over to two outputs (with horizontal stubs)
  el('path',{d:'M622,270 H638 L694,342 H712',class:'xline'},g);
  el('path',{d:'M622,342 H638 L694,270 H712',class:'xline'},g);
  TL(g,632,303,['INPUT','PORT'],{s:5.4,lh:7.2});
  TL(g,701,303,['OUTPUT','PORT'],{s:5.4,lh:7.2});
  TL(g,666,368,['CROSSBAR','6x6'],{s:5.6,w:700,lh:7});
  badge(g,610,225,6);
})();

/* ================= STAGE 7 : output ports ================= */
(function(){
  const g=G([7]);
  const ys=[237,263,289,316,343,370];
  ys.forEach((y,i)=>{ WA(g,722,750,y); T(g,757,y+3,PORTS[i],{s:6.5,w:700,a:'start'}); });
  el('path',{d:'M770,282 L800,173 M770,296 L800,385',fill:'none',stroke:'#334155','stroke-width':.8,'stroke-dasharray':'2 2'},g);
  R(g,800,173,85,212,'rgba(255,255,255,0)','#334155',{dash:'2 2',sw:.8});
  T(g,806,189,'rdyto_rcv_crds',{s:5.3,a:'start'}); A(g,'M850,187 H884');
  T(g,822,230,'REQ',{s:7,w:700}); A(g,'M846,228 H884');
  T(g,822,262,'DAT',{s:7,w:700}); A(g,'M846,260 H884');
  T(g,820,304,'SNPFLITV',{s:5.3}); A(g,'M840,302 H884');
  T(g,818,319,'SNPFLIT',{s:5.3}); A(g,'M838,317 H884');
  T(g,866,312,'126 bits',{s:5.3});
  T(g,822,372,'RSP',{s:7,w:700}); A(g,'M846,370 H884');
  A(g,'M640,387 V400 H565 V410','dash');
  badge(g,800,173,7);
})();

/* ================= STAGE 8 : flow control unit ================= */
(function(){
  const g=G([4,7,8,9]);
  R(g,475,410,103,82,'#ddd6fe','#7c3aed');
  T(g,526,419,'FLOW CONTROL UNIT',{s:5.8,w:700});
  R(g,485,424,66,62,'#ede9fe','#7c3aed',{plain:true,sw:.6});
  T(g,518,431,'CREDIT MANAGER',{s:4.8,w:700});
  R(g,492,436,52,28,'#fff','#334155',{plain:true,sw:.6});
  TL(g,518,443,['CREDIT','COUNTER'],{s:4.8,lh:6});
  const c=T(g,518,460,'4',{s:9,w:800,c:'#1e1b4b'}); c.setAttribute('id','cnt');
  TL(g,565,431,['DECREMENT','ON SENT'],{s:4.4,lh:5.5});
  el('circle',{cx:563,cy:446,r:5.5,fill:'#fff',stroke:'#334155','stroke-width':.7},g);
  T(g,563,449,'−',{s:9,w:700});
  el('circle',{cx:518,cy:474,r:5,fill:'#fff',stroke:'#334155','stroke-width':.7},g);
  T(g,518,477,'+',{s:8,w:700});
  TL(g,527,473,['INCREMENT','ON RETURN'],{s:4.4,a:'start',lh:5.5});
  badge(g,475,410,8);
  const h=G([9]);
  badge(h,782,455,9);
  A(h,'M475,430 H252 V374');
  T(h,365,424,'L CREDIT SENT (LCRDV)',{s:6.8});
  A(h,'M884,336 H782 V455 H579');
  T(h,862,332,'LCRDV',{s:5.3});
  T(h,680,451,'L CREDIT RECEIVED',{s:6.8});
})();

/* ================= STAGE DATA ================= */
const STAGES=[
 {name:'Overview – updated router functional block',
  txt:"Detailed functional block diagram of a CHI-based router illustrating the five-stage pipeline and flow-control unit for a single CHI channel; the remaining CHI channels follow the same router pipeline architecture."},
 {name:'Stage 1 – Decode & input ports',
  txt:"The router features 6 distinct physical input ports (East, West, North, South, Local 0, Local 1). Each port receives incoming flits partitioned into REQ, DAT, SNP, and RSP networks. Incoming flits are decoded and written into the Virtual Channel (VC) buffers."},
 {name:'Stage 2 – Buffer Write (BW)',
  txt:"Each network message class is assigned to dedicated VC buffers (e.g., VC0-VC3) awaiting further processing."},
 {name:'Stage 3 – Route Computation (RC)',
  txt:"Once a flit is buffered, the RC unit computes the output port using XY routing by comparing the current router coordinates with the destination coordinates."},
 {name:'Stage 4 – Resource Allocation (RA)  ★ UPDATED',
  txt:"In the RA stage, flits are prioritized based on their QoS values. For each selected flit, the availability of downstream credits for its destination port and VC is checked. If credits are available, the corresponding downstream credit is allocated to the VC requesting the flit, allowing it to proceed to the next stage.",
  ra:true},
 {name:'Stage 5 – Switch Allocation (SA)',
  txt:"Flits with reserved downstream VCs compete for switch crossbar access. The SA grants access based on QoS values across port requests.",
  ra:false},
 {name:'Stage 6 – Switch Traversal (ST)',
  txt:"Winning flits read from their BW buffers, traverse the 6x6 Crossbar switch matrix, and are forwarded to their designated output ports."},
 {name:'Stage 7 – Output ports',
  txt:'Output ports E / W / N / S / L0 / L1 of snoop channel are used for the traversal of flit to the particular assigned direction to the upstream router.'},
 {name:'Stage 8 – Credit counter decrement',
  txt:"Upon successful traversal, the Flow Control Unit decrements the local credit counter and regenerates a credit."},
 {name:'Stage 9 – LCRDV credit return',
  txt:"The VC State Machine monitors buffer occupancy and VC status, while the Flow Control Unit manages the credit ecosystem for upstream and downstream synchronization."}
];

/* ================= UI ================= */
const chipsEl=document.getElementById('chips'), infoEl=document.getElementById('info'), cntEl=document.getElementById('cnt');
const CHIPS=['Overview','Decode','BW','RC','RA','SA','ST','Output port','Decrement','LCRDV'];
CHIPS.forEach((n,i)=>{
  const c=document.createElement('div');
  c.className='chip'+(i===4?' ra':'');
  c.innerHTML=`<i>${i===0?'●':i}</i>${n}${i===4?' <span class="tag">UPDATED</span>':''}`;
  c.onclick=()=>{userTouch();setStep(i)};
  chipsEl.appendChild(c);
});

let step=0, playing=false, timer=0, cntTimer=0, cntTimer2=0, boot=0;
const INTERVAL=3600;

function applyBlocks(n){
  svg.classList.toggle('staged',n>0);
  svg.querySelectorAll('.blk').forEach(b=>{
    const s=b.dataset.s.split(',').map(Number);
    b.classList.toggle('on', n>0 && s.includes(n));
  });
}
function setCounter(v,flash){
  cntEl.textContent=v;
  if(flash){ cntEl.classList.remove('flash'); void cntEl.getBoundingClientRect(); cntEl.classList.add('flash'); }
}
function setStep(n){
  step=n;
  applyBlocks(n);
  chipsEl.querySelectorAll('.chip').forEach((c,i)=>c.classList.toggle('active',i===n));
  const S=STAGES[n];
  infoEl.className='info'+(S.ra||n===0?' ra':'');
  infoEl.innerHTML=`<b>${S.name}</b><p>${S.txt}</p>`;
  clearTimeout(cntTimer); clearTimeout(cntTimer2);
  setCounter(4);
  if(n===8){ cntTimer=setTimeout(()=>setCounter(3,true),1000); }
  else if(n===9){ setCounter(3); cntTimer=setTimeout(()=>setCounter(4,true),1200); }
}
const next=()=>setStep(step>=9?1:step+1);
const prev=()=>setStep(step<=0?9:step-1);
function play(){ playing=true; document.getElementById('bPlay').textContent='⏸ Pause'; clearInterval(timer); timer=setInterval(next,INTERVAL); }
function pause(){ playing=false; document.getElementById('bPlay').textContent='▶ Play'; clearInterval(timer); }
function userTouch(){ clearTimeout(boot); if(playing){ clearInterval(timer); timer=setInterval(next,INTERVAL);} }

document.getElementById('bNext').onclick=()=>{userTouch();next()};
document.getElementById('bPrev').onclick=()=>{userTouch();prev()};
document.getElementById('bPlay').onclick=()=>{ clearTimeout(boot); playing?pause():(play(),next()); };
document.getElementById('bReset').onclick=()=>{ clearTimeout(boot); pause(); setStep(0); };
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){userTouch();next()}
  else if(e.key==='ArrowLeft'){userTouch();prev()}
  else if(e.key===' '){e.preventDefault();document.getElementById('bPlay').click()}
});

setStep(0);
pause();
window.hwSlide={goto:function(n){ clearTimeout(boot); pause(); setStep(n); }};
</script>
<style id="hw-fit">
/* fit inside the deck frame: the deck drives the steps, so the slide's own nav bar and text panel are hidden */
html,body{height:100%;overflow:hidden}
header,.chips,.info{display:none}
main{padding:4px 10px}
svg{height:calc(100vh - 16px);min-height:0}
</style>
<script>
/* Hardware deck bridge: arrow keys / Space are forwarded to the deck, and the deck drives this slide's steps. */
(function(){
  function post(m){ try{ parent.postMessage(m,'*'); }catch(e){} }
  window.addEventListener('keydown',function(e){
    if(e.code==='ArrowRight'||e.code==='ArrowLeft'||e.code==='Space'){
      e.preventDefault(); e.stopImmediatePropagation(); post({hw:'key',code:e.code});
    }
  },true);
  window.hwReport=function(n){ post({hw:'step',step:n}); };
  window.hwPost=post;
  window.addEventListener('message',function(e){
    var m=e.data; if(!m||!m.hw||!window.hwSlide) return;
    if(m.hw==='goto') window.hwSlide.goto(m.step);
    else if(m.hw==='play'&&window.hwSlide.play) window.hwSlide.play();
    else if(m.hw==='pause'&&window.hwSlide.pause) window.hwSlide.pause();
  });
  window.addEventListener('load',function(){ setTimeout(function(){ post({hw:'ready'}); },0); });
})();
</script>
</body>
</html>
