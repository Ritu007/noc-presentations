<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RN-F, HN-F and SN-F diagrams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --film:   #E5EBE9;
    --grid:   #D1DAD7;
    --paper:  #F7F9F8;
    --ink:    #16232C;
    --muted:  #56676F;

    --rtr:    #F2A99E;  --rtr-s: #B5412F;
    --rn:     #E8BCEE;  --rn-s:  #96479F;
    --sn:     #7FA8F2;  --sn-s:  #3562BA;
    --hn:     #B9E2C0;  --hn-s:  #3F8A55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background-color: var(--film);
  }

  .wrap {
    min-height: 100vh;
    display: grid;
    grid-template-columns: min(620px, calc((100vh - 110px) * .93));
    gap: 22px;
    align-content: center;
    justify-content: center;
    padding: 32px;
  }

  /* ---------- view dots (no text) ---------- */
  .dots { display: flex; justify-content: center; gap: 14px; }
  .dots button {
    position: relative;
    width: 14px; height: 14px; padding: 0;
    border-radius: 50%;
    border: 1.5px solid var(--ink);
    background: transparent;
    cursor: pointer;
    transition: background .3s ease;
  }
  .dots button::before { content: ""; position: absolute; inset: -12px; }
  .dots button[aria-pressed="true"] { background: var(--ink); }

  /* ---------- diagram ---------- */
  .stage {
    width: 100%;
    aspect-ratio: 624 / 670;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    box-shadow: 8px 8px 0 rgba(22, 35, 44, .14);
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .stage svg { display: block; width: 100%; height: 100%; }
  svg text {
    font-family: inherit;
    font-weight: 600;
    text-anchor: middle;
    dominant-baseline: central;
    fill: var(--ink);
    pointer-events: none;
  }
  .link { stroke: var(--ink); stroke-width: 1.6; fill: none; }

  .node .sh   { fill: var(--ink); opacity: .10; }
  .node .body {
    fill: var(--paper); stroke: var(--ink); stroke-width: 1.6;
    transition: fill .55s ease, stroke .55s ease;
    transition-delay: var(--d, 0s);
  }
  main[data-view="2"] .rtr .body { fill: var(--rtr); stroke: var(--rtr-s); }
  main[data-view="3"] .rn  .body { fill: var(--rn);  stroke: var(--rn-s); }
  main[data-view="3"] .sn  .body { fill: var(--sn);  stroke: var(--sn-s); }
  main[data-view="3"] .hn  .body { fill: var(--hn);  stroke: var(--hn-s); }

  /* focus: everything outside the highlighted group is blurred and dimmed */
  .node, .link { transition: filter .5s ease, opacity .5s ease; }
  main[data-view="2"] .node:not(.rtr),
  main[data-view="2"] .link:not(.rr),
  main[data-view="3"] .node:not(.rn):not(.sn):not(.hn),
  main[data-view="3"] .link {
    filter: blur(2.5px);
    opacity: .38;
  }

  :focus-visible { outline: 3px solid #2F6BFF; outline-offset: 3px; }

  /* ---------- small screens ---------- */
  @media (max-width: 880px) {
    .wrap { grid-template-columns: minmax(0, 560px); padding: 24px 20px 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main class="wrap" id="app" data-view="1">


  <div class="stage" id="stage" role="button" tabindex="0" aria-label="Switch diagram view">
    <svg id="svg" viewBox="-12 -12 624 670" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="Two processing elements connect through RN-F1 and RN-F2 to a 2 by 2 router mesh R00, R01, R10, R11. SN-F3 and HN-F2 connect to R10 and R11, and SN-F3 connects to main memory.">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10"
                markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0,1.2 L10,5 L0,8.8 z" fill="#16232C"/>
        </marker>
      </defs>
      <g id="links"></g>
      <g id="nodes"></g>
    </svg>
  </div>

  <div class="dots" role="group" aria-label="Choose diagram">
    <button type="button" data-i="1" aria-label="Plain view" aria-pressed="true"></button>
    <button type="button" data-i="2" aria-label="Router mesh view" aria-pressed="false"></button>
    <button type="button" data-i="3" aria-label="Node types view" aria-pressed="false"></button>
  </div>
</main>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';

  // Same layout for both views; only the colouring changes.
  var nodes = [
    { c: 'pe',  x: 40,  y: 20,  w: 130, h: 56, t: ['Processing', 'Element 1'] },
    { c: 'pe',  x: 430, y: 20,  w: 130, h: 56, t: ['Processing', 'Element 2'] },
    { c: 'rn',  x: 40,  y: 130, w: 130, h: 56, t: ['RN-F1'] },
    { c: 'rn',  x: 430, y: 130, w: 130, h: 56, t: ['RN-F2'] },
    { c: 'rtr', x: 200, y: 250, w: 80,  h: 44, t: ['R00'] },
    { c: 'rtr', x: 320, y: 250, w: 80,  h: 44, t: ['R01'] },
    { c: 'rtr', x: 200, y: 350, w: 80,  h: 44, t: ['R10'] },
    { c: 'rtr', x: 320, y: 350, w: 80,  h: 44, t: ['R11'] },
    { c: 'sn',  x: 40,  y: 470, w: 130, h: 56, t: ['SN-F3'] },
    { c: 'hn',  x: 430, y: 470, w: 130, h: 56, t: ['HN-F2'] },
    { c: 'mem', x: 40,  y: 580, w: 130, h: 56, t: ['Main', 'Memory'] }
  ];

  var links = [
    [105, 76, 105, 130],     // PE1  - RN-F1
    [495, 76, 495, 130],     // PE2  - RN-F2
    [150, 186, 208, 250],    // RN-F1 - R00
    [450, 186, 392, 250],    // RN-F2 - R01
    [280, 272, 320, 272],    // R00 - R01
    [280, 372, 320, 372],    // R10 - R11
    [240, 294, 240, 350],    // R00 - R10
    [360, 294, 360, 350],    // R01 - R11
    [208, 394, 150, 470],    // R10 - SN-F3
    [392, 394, 450, 470],    // R11 - HN-F2
    [105, 526, 105, 580]     // SN-F3 - Main Memory
  ];

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  var lg = document.getElementById('links');
  links.forEach(function (l, i) {
    el('line', { x1: l[0], y1: l[1], x2: l[2], y2: l[3], 'class': (i >= 4 && i <= 7) ? 'link rr' : 'link',
                 'marker-start': 'url(#ah)', 'marker-end': 'url(#ah)' }, lg);
  });

  var ng = document.getElementById('nodes');
  nodes.forEach(function (n, i) {
    var g = el('g', { 'class': 'node ' + n.c }, ng);
    g.style.setProperty('--d', (i * 0.035).toFixed(3) + 's');
    el('rect', { 'class': 'sh',   x: n.x + 4, y: n.y + 4, width: n.w, height: n.h, rx: 5 }, g);
    el('rect', { 'class': 'body', x: n.x,     y: n.y,     width: n.w, height: n.h, rx: 5 }, g);
    var cx = n.x + n.w / 2, cy = n.y + n.h / 2;
    var size = n.c === 'rtr' ? 19 : 20;
    if (n.t.length === 1) {
      var t = el('text', { x: cx, y: cy, 'font-size': size }, g);
      t.textContent = n.t[0];
    } else {
      n.t.forEach(function (line, k) {
        var t = el('text', { x: cx, y: cy + (k ? 11 : -11), 'font-size': 16 }, g);
        t.textContent = line;
      });
    }
  });

  // ----- view switching -----
  var app = document.getElementById('app');
  var btns = document.querySelectorAll('.dots button');
  var cur = 1;

  function show(v) {
    cur = v;
    app.setAttribute('data-view', String(v));
    btns.forEach(function (b) {
      b.setAttribute('aria-pressed', String(parseInt(b.getAttribute('data-i'), 10) === v));
    });
  }
  function toggle() { show(cur % 3 + 1); hwReport(cur - 1); }
  window.hwSlide = { goto: function (n) { show(n + 1); } };

  var stage = document.getElementById('stage');
  stage.addEventListener('click', toggle);
  stage.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });
  btns.forEach(function (b) {
    b.addEventListener('click', function () { var v = parseInt(b.getAttribute('data-i'), 10); show(v); hwReport(v - 1); });
  });
})();
</script>
<style id="hw-fit">
/* fit inside the deck frame: the deck drives the three views, so the dots are hidden */
html,body{height:100%;overflow:hidden}
body{min-height:0}
.wrap{min-height:0;height:100vh;grid-template-columns:min(96vw,calc((100vh - 24px) * .93));padding:12px;gap:0}
.dots{display:none}
.stage{box-shadow:none}
</style>
<script>
/* Hardware deck bridge: arrow keys / Space are forwarded to the deck, and the deck drives this slide's steps. */
(function(){
  function post(m){ try{ parent.postMessage(m,'*'); }catch(e){} }
  window.addEventListener('keydown',function(e){
    if(e.code==='ArrowRight'||e.code==='ArrowLeft'||e.code==='Space'){
      e.preventDefault(); e.stopImmediatePropagation(); post({hw:'key',code:e.code});
    }
  },true);
  window.hwReport=function(n){ post({hw:'step',step:n}); };
  window.hwPost=post;
  window.addEventListener('message',function(e){
    var m=e.data; if(!m||!m.hw||!window.hwSlide) return;
    if(m.hw==='goto') window.hwSlide.goto(m.step);
    else if(m.hw==='play'&&window.hwSlide.play) window.hwSlide.play();
    else if(m.hw==='pause'&&window.hwSlide.pause) window.hwSlide.pause();
  });
  window.addEventListener('load',function(){ setTimeout(function(){ post({hw:'ready'}); },0); });
})();
</script>
</body>
</html>
